[server]
headless = true
address = "0.0.0.0"
port = 8080
fileWatcherType = "none"
runOnSave = false
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#5577D4"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#182230"
font = "sans-serif"
